name: sheguard_app
description: SheGuard mobile safety MVP frontend for the SheGuard_AI backend.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^17.2.2
  connectivity_plus: ^6.0.5
  telephony:
    path: third_party/telephony
  sensors_plus: ^7.0.0
  record: ^6.2.0
  speech_to_text: ^7.0.0
  camera: ^0.11.2+1
  path_provider: ^2.1.5
  cryptography: ^2.9.0
  url_launcher: ^6.3.2
  battery_plus: ^7.0.0
  flutter_background_service: ^5.0.10
  wakelock_plus: ^1.2.8
  flutter_phone_direct_caller: ^2.1.1
  network_info_plus: ^6.1.4
  geocoding: ^4.0.0
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
